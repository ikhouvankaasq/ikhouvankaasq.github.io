<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akinator Clone</title>
    <!-- Tailwind CSS voor een moderne look -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- CONTAINER -->
    <div id="app" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 text-center">
        
        <!-- STAP 1: HOMEPAGE -->
        <div id="screen-home">
            <h1 class="text-3xl font-extrabold mb-2 text-indigo-400">Akinator Clone</h1>
            <p class="text-slate-400 mb-6">Think of a character, and let the system guess it!</p>
            <button onclick="goToModeSelect()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 px-6 rounded-xl transition duration-200">
                Start Game
            </button>
        </div>

        <!-- STAP 2: GAMEMODE SELECTOR -->
        <div id="screen-modes" class="hidden">
            <h2 class="text-xl font-bold mb-4">Select Game Mode</h2>
            <div class="space-y-3">
                <button onclick="startGame()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-semibold py-3 px-4 rounded-xl transition">
                    Characters Mode
                </button>
                <button onclick="goHome()" class="w-full bg-slate-700 hover:bg-slate-600 font-semibold py-3 px-4 rounded-xl transition">
                    Back
                </button>
            </div>
        </div>

        <!-- STAP 3: GAME SCHERM (VRAGEN) -->
        <div id="screen-game" class="hidden">
            <p id="question-counter" class="text-xs uppercase tracking-wider text-indigo-400 font-semibold mb-2">Question 1</p>
            <h3 id="question-text" class="text-xl font-bold mb-6 min-h-[4rem] flex items-center justify-center">Loading question...</h3>
            
            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="answerQuestion(true)" class="bg-green-600 hover:bg-green-500 font-bold py-3 rounded-xl transition">Yes</button>
                <button onclick="answerQuestion(false)" class="bg-red-600 hover:bg-red-500 font-bold py-3 rounded-xl transition">No</button>
            </div>
            <button onclick="answerQuestion('dont_know')" class="w-full bg-slate-700 hover:bg-slate-600 text-sm font-semibold py-2 rounded-xl transition">Don't know</button>
        </div>

        <!-- STAP 4: RESULTAAT / GEVONDEN -->
        <div id="screen-result" class="hidden">
            <h2 class="text-xl font-bold mb-2 text-indigo-400">Is this your character?</h2>
            <div id="result-box" class="my-6 p-4 bg-slate-700/50 rounded-xl border border-slate-600">
                <h3 id="result-name" class="text-2xl font-extrabold text-white">Character Name</h3>
            </div>
            <div class="space-y-3">
                <button onclick="resetGame()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl transition">Play Again</button>
            </div>
        </div>

    </div>

    <!-- FIREBASE LOGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Jouw Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyC_S2t4gW6I0BFqaJeFHnJYtAHgkvdZp7c",
            authDomain: "akinator-d3903.firebaseapp.com",
            projectId: "akinator-d3903",
            storageBucket: "akinator-d3903.firebasestorage.app",
            messagingSenderId: "13289535157",
            appId: "1:13289535157:web:d366ce7897703b9e8f30fc",
            measurementId: "G-XRLPJHZS2W"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allCharacters = [];
        let allQuestions = [];
        let remainingCharacters = [];
        let askedQuestionAttributes = new Set();
        let currentQuestion = null;
        let questionCount = 0;

        // Data inladen vanuit Firestore
        async function loadGameData() {
            try {
                // Haal characters op
                const charSnapshot = await getDocs(collection(db, "Characters"));
                allCharacters = charSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                // Haal questions op
                const qSnapshot = await getDocs(collection(db, "Questions"));
                allQuestions = qSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                console.log("Loaded characters:", allCharacters.length);
                console.log("Loaded questions:", allQuestions.length);
            } catch (error) {
                console.error("Error loading data from Firebase:", error);
            }
        }

        loadGameData();

        // Globale functies koppelen aan window zodat knoppen ze kunnen aanroepen
        window.goToModeSelect = function() {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-modes').classList.remove('hidden');
        }

        window.goHome = function() {
            document.getElementById('screen-modes').classList.add('hidden');
            document.getElementById('screen-home').classList.remove('hidden');
        }

        window.startGame = function() {
            if (allCharacters.length === 0 || allQuestions.length === 0) {
                alert("Data is still loading or collections are empty in Firebase!");
                return;
            }

            // Kopieer alle personages om mee te spelen
            remainingCharacters = JSON.parse(JSON.stringify(allCharacters));
            askedQuestionAttributes.clear();
            questionCount = 0;

            document.getElementById('screen-modes').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');

            nextStep();
        }

        function nextStep() {
            // Check of we nog maar 1 personage over hebben of geen vragen meer hebben
            if (remainingCharacters.length <= 1 || askedQuestionAttributes.size >= allQuestions.length) {
                showResult();
                return;
            }

            questionCount++;
            document.getElementById('question-counter').innerText = `Question ${questionCount}`;

            // Filter vragen die we al gesteld hebben
            const availableQuestions = allQuestions.filter(q => !askedQuestionAttributes.has(q.attribute));

            if (availableQuestions.length === 0) {
                showResult();
                return;
            }

            // Kies voorlopig de eerste beschikbare vraag (of later een slimme 50/50 vraag)
            currentQuestion = availableQuestions[0];
            document.getElementById('question-text').innerText = currentQuestion.question;
        }

        window.answerQuestion = function(answer) {
            const attr = currentQuestion.attribute;
            askedQuestionAttributes.add(attr);

            if (answer !== 'dont_know') {
                // Filter de overgebleven personages
                remainingCharacters = remainingCharacters.filter(char => {
                    const charAttrValue = char.attributes && char.attributes[attr] === true;
                    if (answer === true) {
                        return charAttrValue === true; // Moet true zijn
                    } else {
                        return charAttrValue !== true; // Is false of ontbreekt (wordt als false beschouwd)
                    }
                });
            }

            nextStep();
        }

        function showResult() {
            document.getElementById('screen-game').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');

            const nameEl = document.getElementById('result-name');
            if (remainingCharacters.length > 0) {
                nameEl.innerText = remainingCharacters[0].name || remainingCharacters[0].naam || "Unknown Character";
            } else {
                nameEl.innerText = "I couldn't find your character! 😢";
            }
        }

        window.resetGame = function() {
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-home').classList.remove('hidden');
        }
    </script>
</body>
</html>
